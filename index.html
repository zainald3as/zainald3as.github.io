<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zain: cybersecurity, a dusk alley, an old man reading, and a black cat.">
<title>Zain's Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Alegreya:ital,wght@0,400;0,500;1,400&family=Aref+Ruqaa:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout concept: one dusk alley in an old Levantine city; the site is walked through, not scrolled past. Single deliberate dusk palette. */
:root{
  --night:#141a2e;      /* sky at the top, page ground */
  --dusk:#2a2440;       /* shadowed stone */
  --stone:#d8c8a6;      /* limestone */
  --stone-dim:#a8977a;
  --lantern:#f1b75a;    /* warm light, the one accent */
  --tile:#2f7f7a;       /* Damascus tile teal */
  --olive:#6c7a3d;
  --eye:#f3d02b;
  --ink:#ece3cf;        /* text on night */
  --muted:#b9ad95;
  --display:"Marcellus SC","Marcellus",Georgia,serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  --arabic:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  color-scheme:dark;
}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- scene ---------- */
.scene{position:relative;width:100%;aspect-ratio:5/3;max-height:80vh;overflow:hidden;background:var(--night)}
.scene svg{display:block;width:100%;height:100%}
.flicker{animation:flicker 3.2s infinite steps(1)}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.86}44%{opacity:1}71%{opacity:.92}}
.glow{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.8}}

/* cat */
#cat{transform:translate(-160px,0)}
#cat.walking{animation:walk 7.5s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes walk{to{transform:translate(560px,0)}}
#cat .leg{transform-box:fill-box;transform-origin:top center}
#cat.walking .leg.a{animation:step .5s ease-in-out infinite alternate}
#cat.walking .leg.b{animation:step .5s ease-in-out infinite alternate-reverse}
@keyframes step{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
#cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
#cat-sit{opacity:0;transition:opacity .5s}
.sat #cat-walk{opacity:0;transition:opacity .4s}
.sat #cat-sit{opacity:1}
.eye{animation:blink 6s infinite}
.eye{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* doors */
.door{cursor:pointer;outline:none}
.door .light{opacity:0;transition:opacity .4s}
.door:hover .light,.door:focus-visible .light,.door.open .light{opacity:1}
.door:focus-visible .frame{stroke:var(--lantern);stroke-width:3}
.plaque{font-family:"Marcellus",Georgia,serif;font-size:17px;letter-spacing:.02em;fill:#1f1a14}
.plaque-k{font-family:var(--display);font-size:10.5px;letter-spacing:.16em;fill:#5a4320}

/* ---------- below the scene ---------- */
.ground{border-top:1px solid #2f2b45;background:linear-gradient(var(--dusk),var(--night) 60%)}
.inner{max-width:62rem;margin:0 auto;padding-block:3.5rem 4rem;display:grid;gap:3rem}
.mine{margin:0 auto;max-width:40rem;display:grid;gap:1.6rem;text-align:center}
.mine p{margin:0;font-family:"Aref Ruqaa","IM Fell English",Georgia,serif;font-size:clamp(1.45rem,3.3vw,2.2rem);line-height:1.6;color:var(--stone)}
.mine p span{display:block}
.mine .open{font-size:.72em;color:var(--muted)}
.mine .reveal{font-weight:700;color:var(--lantern);font-size:clamp(1.7rem,4vw,2.7rem)}
.mine .reveal::before{content:"";display:block;width:3.5rem;height:1px;margin:0 auto 1.4rem;background:var(--lantern);opacity:.6}
.nudge{margin:0;font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--muted)}
.nudge button{all:unset;cursor:pointer;color:var(--lantern);border-bottom:1px solid var(--lantern)}
.nudge button:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
#reader:focus-visible{outline:2px solid var(--lantern)}

/* the book: grows out of the old man's hands into an open spread */
.veil[hidden]{display:none}
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,12,22,.78);display:grid;place-items:center;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.book{--paper:#efe4cb;--paper2:#e3d4b3;--ink2:#2b2117;--rule:#c9b68f;position:relative;width:min(62rem,100%);
  display:grid;grid-template-columns:1fr 1fr;
  background:linear-gradient(90deg,var(--paper2),var(--paper) 46%,#c8b590 50%,var(--paper) 54%,var(--paper2));
  color:var(--ink2);box-shadow:0 40px 80px -20px #000c;border-radius:3px 3px 8px 8px}
.page{padding:2.6rem 2.3rem 2.2rem;min-width:0;font-family:"IM Fell English",Georgia,serif}
.cover{margin:0 0 1.4rem;font-size:1.6rem;line-height:1.25}
.cover span{font-style:italic;font-size:1.1rem;color:#7a5a2c}
.toc{margin:0;padding:0 0 0 1.3rem;display:grid;gap:.4rem;font-size:1.08rem}
.toc li::marker{color:#7a5a2c;font-style:italic}
.toc button{all:unset;cursor:pointer;border-bottom:1px solid transparent}
.toc button:hover{border-bottom-color:var(--ink2)}
.toc button[aria-current=true]{font-style:italic;color:#6b2f2a}
.page.right{display:grid;align-content:start;gap:.7rem;border-left:1px solid var(--rule)}
.page.right h2{margin:0;font-weight:400;font-size:clamp(1.7rem,3vw,2.2rem);line-height:1.15;text-wrap:balance}
.when{margin:0;font-style:italic;color:#7a5a2c;min-height:1.2em}
.field{margin:0;font-style:italic}
#p-text{margin:0;max-width:58ch;line-height:1.55;font-size:1.1rem}
.turn{display:flex;align-items:center;gap:1rem;margin-top:1rem;font-style:italic;color:#7a5a2c}
.turn button,.close{all:unset;cursor:pointer;font-size:1.5rem;line-height:1;padding:.2rem .45rem;color:var(--ink2)}
.close{position:absolute;top:.5rem;right:.7rem;font-size:1.8rem}
.book button:focus-visible{outline:2px solid #6b2f2a;outline-offset:2px}
.flip{animation:flip .45s ease}
@keyframes flip{from{opacity:.15;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (max-width:720px){.book{grid-template-columns:1fr;background:var(--paper)}.page.right{border-left:0;border-top:1px solid var(--rule)}.page{padding:2rem 1.3rem 1.6rem}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #cat{transform:translate(560px,0)!important}
}
</style>

<main class="ground wrap">
  <div class="inner">
    <blockquote class="mine">
      <p><span class="open">A great man once said:</span>
        <span>knowledge is limitless,</span>
        <span>and I am limited.</span>
        <span>The only thing I envy is knowledge,</span>
        <span>and that envy drives me on,</span>
        <span>a goal without an end.</span></p>
      <p class="reveal">That great man is me.</p>
    </blockquote>
    <p class="nudge">The old man by the first door is reading something. <button type="button" id="ask">Look over his shoulder</button></p>
  </div>
</main>

<div class="veil" id="veil" hidden>
  <section class="book" id="the-book" role="dialog" aria-modal="true" aria-label="Projects from my uni years, 2023 to 2026">
    <button type="button" class="close" id="close" aria-label="Close the book">&#215;</button>
    <div class="page left">
      <p class="cover">Projects from my uni years<br><span>2023 &#8211; 2026</span></p>
      <ol class="toc" id="toc"></ol>
    </div>
    <div class="page right" aria-live="polite">
      <p class="when" id="p-when"></p>
      <h2 id="p-title"></h2>
      <p class="field" id="p-field"></p>
      <p id="p-text"></p>
      <div class="turn">
        <button type="button" id="prev" aria-label="Previous page">&#8592;</button>
        <span id="p-num"></span>
        <button type="button" id="next" aria-label="Next page">&#8594;</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  var cat=document.getElementById('cat');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sit(){cat.classList.remove('walking');cat.style.transform='translate(560px,0)';cat.classList.add('sat');}
  if(reduce){sit();}else{
    setTimeout(function(){cat.classList.add('walking');},400);
    cat.addEventListener('animationend',function(e){if(e.animationName==='walk')sit();});
  }
  // Facts only for now. Zain rewrites each page in his own words.
  var pages=[
    {id:null,t:'Airport Management System',w:'Sep – Dec 2024',f:'Programming',x:'A desktop app in Java with a JavaFX interface that schedules departures and landings for private, commercial and cargo planes. It loads flights from CSV, keeps them in its own queue structure, and talks to a small socket server that counts reschedules.'},
    {id:'d-aws',t:'Zero Trust on AWS',w:'Sep – Dec 2025',f:'Cloud security and risk',x:'A team of five tested a Zero Trust risk plan against AWS’s core services, then added a Business Impact Analysis and a Business Continuity Plan aligned with ISO 22301 and NIST SP 800-34. I wrote the abstract, introduction and conclusion.'},
    {id:'d-dna',t:'Genealogy websites and the law',w:'Sep \u2013 Dec 2025',f:'Research, law and policy',x:'A 41-page paper on DNA and family-tree sites like Ancestry and MyHeritage: how they collect genetic data, who else uses it, from scientists to police, and how the law protects it, or fails to, in the US, the UAE and eight more countries, from Hungary and China to Israel and Rwanda. I am the first author.'},
    {id:'d-zeus',t:'Zeus banking Trojan',w:'Jan – Apr 2026',f:'Malware analysis',x:'A team of five took a Zeus/ZBot sample from MalwareBazaar and analysed it statically and dynamically: its code in Ghidra, and its behaviour inside an isolated FLARE VM sandbox.'},
    {id:'d-zelto',t:'ZELTO HR',w:'Jan – Apr 2026',f:'Penetration testing',x:'As team lead, I built a fake HR company with my team of five (an Ubuntu server, an Android app and a Kali attacker) and broke into it. Eleven vulnerabilities, from SMS phishing and a debug-mode APK to JWT algorithm confusion, SSRF, IDOR and a printer left on its default password.'},
    {id:'d-web',t:'Campus Lost & Found',w:'Feb – Apr 2026',f:'Web security',x:'A lost-and-found site for students, built twice in PHP and MySQL: once open to local file inclusion, SQL injection, brute force, stored XSS and IDOR, and once with every one of them fixed and re-tested in Burp Suite.'},
    {id:null,t:'Ransomware at XYZ Corporation',w:'Jan – Apr 2026',f:'Incident response and disaster recovery',x:'A bank with offices in Dubai, London and Singapore. Ransomware encrypts 60% of its databases after the attacker sat in the network for 21 days. With a team of five, I wrote its incident response, disaster recovery and continuity plans: a 72-hour timeline, recovery moved to London, no backup trusted blindly, and notifications under GDPR, DFSA, MAS TRM and PCI-DSS.'},
    {id:null,t:'Hybrid cipher',w:'Sep 2026 –',f:'Cryptography',x:'A cipher in C mixing Caesar and monoalphabetic blocks with a rotating key table. I built the decryption algorithm, which recovers every shift without guessing.'},
    {id:'d-qsoc',t:'QuantumSOC',w:'Sep 2026 –',f:'SOC and post-quantum cryptography',x:'My graduation project: a testbed where a real TLS 1.3 handshake runs on ML-KEM-768 and ML-DSA-65, monitored in Splunk, to measure how ready a SOC is for quantum computers.'},
    {id:null,t:'Cyberus Academy',w:'Sep 2026 –',f:'AI and security training',x:'At Draveron: the AI coach of a cybersecurity training platform, which writes phishing and chat attack scenarios and checks them before learners see them.'}
  ];
  var i=0, toc=document.getElementById('toc'), veil=document.getElementById('veil'), bookEl=document.getElementById('the-book'), lastFocus=null;
  toc.innerHTML=pages.map(function(p,k){return '<li><button type="button" data-k="'+k+'">'+p.t+'</button></li>'}).join('');
  function show(k){
    i=(k+pages.length)%pages.length; var p=pages[i];
    document.getElementById('p-when').textContent=p.w;
    document.getElementById('p-title').textContent=p.t;
    document.getElementById('p-field').textContent=p.f;
    document.getElementById('p-text').textContent=p.x;
    document.getElementById('p-num').textContent=(i+1)+' of '+pages.length;
    toc.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-current',+b.dataset.k===i?'true':'false')});
    var r=bookEl.querySelector('.page.right'); r.classList.remove('flip'); void r.offsetWidth; if(!reduce) r.classList.add('flip');
  }
  function openBook(k){
    lastFocus=document.activeElement;
    show(typeof k==='number'?k:i);
    // grow the book out of the old man's hands
    var sb=document.getElementById('small-book').getBoundingClientRect();
    veil.hidden=false;
    var bb=bookEl.getBoundingClientRect();
    var dx=(sb.left+sb.width/2)-(bb.left+bb.width/2), dy=(sb.top+sb.height/2)-(bb.top+bb.height/2);
    if(!reduce&&bookEl.animate){
      bookEl.animate([{transform:'translate('+dx+'px,'+dy+'px) scale(.04)',opacity:.4},{transform:'none',opacity:1}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)'});
      veil.animate([{opacity:0},{opacity:1}],{duration:400});
    }
    document.getElementById('close').focus();
  }
  function closeBook(){veil.hidden=true; if(lastFocus) lastFocus.focus();}
  toc.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(+b.dataset.k);});
  document.getElementById('prev').addEventListener('click',function(){show(i-1)});
  document.getElementById('next').addEventListener('click',function(){show(i+1)});
  document.getElementById('close').addEventListener('click',closeBook);
  veil.addEventListener('click',function(e){if(e.target===veil)closeBook();});
  document.addEventListener('keydown',function(e){
    if(veil.hidden)return;
    if(e.key==='Escape')closeBook();
    if(e.key==='ArrowRight')show(i+1);
    if(e.key==='ArrowLeft')show(i-1);
  });
  var reader=document.getElementById('reader');
  function act(fn){return function(e){if(e.type==='click'||e.key==='Enter'||e.key===' '){e.preventDefault();fn();}}}
  reader.addEventListener('click',act(function(){openBook(0)}));
  reader.addEventListener('keydown',act(function(){openBook(0)}));
  document.getElementById('ask').addEventListener('click',function(){openBook(0)});
  // the doors still work: each opens the book at its own page
  document.querySelectorAll('.door').forEach(function(d){
    var k=pages.findIndex(function(p){return p.id===d.id});
    var go=act(function(){openBook(k)});
    d.addEventListener('click',go); d.addEventListener('keydown',go);
  });
})();
</script>
